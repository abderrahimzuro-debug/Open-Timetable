name: FET build (engine + GUI) & smoke test

# يتحقق هذا السير من:
#   1) سلامة أرشيف FET المحفوظ (بصمة SHA-256)،
#   2) بناء محرّك fet-cl من المصدر الأصلي وتوليد جداول حقيقية،
#   3) بناء واجهتنا المعدّلة (fet/) — أي أن تعديلاتنا على C++ تُصرَّف فعليًا،
#   4) بناء ملف الترجمة العربية (fet_ar.qm) الذي تعتمد عليه الواجهة.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - 'fet/**'
      - 'vendor/fet/**'
      - 'engine/**'
      - 'scripts/**'
      - 'docker/**'
      - '.github/workflows/engine.yml'
  pull_request:
    paths:
      - 'fet/**'
      - 'vendor/fet/**'
      - 'engine/**'
      - 'scripts/**'
      - '.github/workflows/engine.yml'
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # 1) المحرّك الأصلي كما هو (تحقق من الأصالة والأداء الوظيفي)
  # ------------------------------------------------------------------
  build-engine-upstream:
    name: engine from pristine archive (Linux, Qt5)
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt5 + toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential qtbase5-dev ca-certificates
          qmake --version

      - name: Verify archive integrity (SHA-256)
        run: ./scripts/fet-verify.sh

      - name: Extract FET source
        run: ./scripts/fet-extract.sh

      - name: Build fet-cl
        run: ./scripts/fet-build-cl.sh --qmake

      - name: Smoke test (generate timetables from samples)
        env:
          TIME_LIMIT: 120
        run: ./scripts/fet-smoke-test.sh build/fet-cl

      - name: Upload fet-cl binary
        uses: actions/upload-artifact@v4
        with:
          name: fet-cl-7.12.0-upstream-linux-x86_64
          path: build/fet-cl
          if-no-files-found: error
          retention-days: 30

  # ------------------------------------------------------------------
  # 2) واجهتنا المعدّلة (fet/) — الاختبار الأساسي لتعديلاتنا
  # ------------------------------------------------------------------
  build-our-gui:
    name: our GUI from fet/ (Linux, Qt5)
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt5 (widgets, printsupport, linguist) + toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential qtbase5-dev qtbase5-dev-tools qttools5-dev-tools ca-certificates
          qmake --version

      - name: Build FET GUI + fet-cl from fet/
        run: |
          set -o pipefail
          mkdir -p build/gui && cd build/gui
          qmake ../../fet/fet.pro CONFIG+=release
          make -j"$(nproc)" 2>&1 | tee build.log
          echo "--- binaries found ---"
          find . -maxdepth 3 -type f \( -name 'fet' -o -name 'fet-cl' \) -print
          BIN_GUI="$(find . -maxdepth 3 -type f -name 'fet' | head -1)"
          BIN_CL="$(find . -maxdepth 3 -type f -name 'fet-cl' | head -1)"
          mkdir -p ../out
          cp "$BIN_GUI" ../fet
          cp "$BIN_CL" ../fet-cl
          ls -l ../fet ../fet-cl

      - name: Report compile errors
        if: failure()
        run: |
          LOG=build/gui/build.log
          if [ -f "$LOG" ]; then
            {
              echo '### Compile errors'
              echo '```'
              tail -60 "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # نُخرج آخر السطور كتعليقات (annotations) حتى تظهر عبر API
            tail -40 "$LOG" | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line//$'\r'/}"
            done
          else
            echo "::error::build.log not found"
            find build -maxdepth 3 -name '*.log' -o -name 'Makefile' | head -20
          fi

      - name: Build Arabic translation (fet_ar.qm)
        run: ./scripts/fet-build-translations.sh ar

      - name: GUI self-check (headless, offscreen)
        # يتحقق فعليًا أن الواجهة تُقلع وأن الشريط الجانبي ولوحة البداية والمظهر تعمل،
        # دون الحاجة إلى شاشة (يُستعمل نفس الفحص عند تشخيص مشاكل التثبيت).
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen ./build/fet --ot-selfcheck 2>&1 | tee selfcheck.log
          # نُظهر سطور التقرير كتعليقات (annotations) لتبقى قابلة للقراءة عبر API
          grep -E '\[ok\]|\[FAIL\]|SELFCHECK|Qt:|platform:|style:' selfcheck.log | \
            while IFS= read -r line; do echo "::notice::${line}"; done
          grep -q "SELFCHECK OK" selfcheck.log

      - name: Smoke test our fet-cl
        env:
          TIME_LIMIT: 120
        run: ./scripts/fet-smoke-test.sh build/fet-cl

      - name: Package Linux portable bundle
        run: |
          set -e
          PKG=build/package/open-timetable-linux-x86_64
          mkdir -p "$PKG/translations"
          cp build/fet "$PKG/open-timetable"
          cp build/fet-cl "$PKG/fet-cl"
          cp build/translations/*.qm "$PKG/translations/" 2>/dev/null || true
          cp fet/LICENSE "$PKG/LICENSE"
          cp docs/INSTALL.md "$PKG/INSTALL.md"
          cat > "$PKG/run.sh" <<'EOF'
          #!/usr/bin/env bash
          # تشغيل Open-Timetable (يتطلب Qt5 مثبّتًا على النظام).
          cd "$(dirname "$0")" && exec ./open-timetable "$@"
          EOF
          chmod +x "$PKG/run.sh" "$PKG/open-timetable" "$PKG/fet-cl"
          tar -czf build/package/open-timetable-linux-x86_64.tar.gz -C build/package open-timetable-linux-x86_64
          ls -lh build/package/open-timetable-linux-x86_64.tar.gz

      - name: Upload our binaries + translations
        uses: actions/upload-artifact@v4
        with:
          name: open-timetable-gui-linux-x86_64
          path: |
            build/fet
            build/fet-cl
            build/translations
            build/package/open-timetable-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload GUI build log + self-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-build-log-ours
          path: |
            build/gui/build.log
            selfcheck.log
          retention-days: 7

  # ------------------------------------------------------------------
  # 3) ويندوز (بيئة التشغيل المستهدفة: جهاز في المؤسسة) — غير معطِّل مؤقتًا
  # ------------------------------------------------------------------
  build-windows-probe:
    name: our GUI on Windows (Qt6) + portable ZIP
    # يعمل مع كل تعديل يمسّ الواجهة كي تبقى حزمة ويندوز الجاهزة متوفّرة دائمًا
    # (لا يفشل السير كله عند تعثّر ويندوز: continue-on-error).
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # FET's own Windows builds use MinGW (not MSVC): MSVC hits
      # "fatal error C1061: compiler limit: blocks nested too deeply" in
      # engine/rules.cpp, while MinGW compiles it fine.
      - name: Install Qt 6.10 (MinGW 13.1 x64) + MinGW toolchain
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.0'
          arch: 'win64_mingw'
          tools: 'tools_mingw1310'
          cache: true

      - name: Build (qmake + mingw32-make)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\win | Out-Null
          Set-Location build\win
          qmake ..\..\fet\fet.pro CONFIG+=release
          if ($LASTEXITCODE -ne 0) {
            throw "qmake failed with exit code $LASTEXITCODE"
          }
          mingw32-make -j"$env:NUMBER_OF_PROCESSORS" 2>&1 | Tee-Object -FilePath make.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "=== build errors ==="
            Get-Content make.log |
              Select-String -Pattern 'error|fatal|Error' |
              Select-Object -First 40 |
              ForEach-Object { Write-Host "::error::$($_.Line)" }
            throw "mingw32-make failed with exit code $code"
          }
          Get-ChildItem -Recurse -Filter *.exe | Select-Object FullName, Length

      - name: Package Windows portable bundle (windeployqt)
        shell: pwsh
        run: |
          $gui = Get-ChildItem -Path build\win -Recurse -Filter fet.exe | Select-Object -First 1
          $cli = Get-ChildItem -Path build\win -Recurse -Filter fet-cl.exe | Select-Object -First 1
          if (-not $gui) { throw "fet.exe not found in build/win" }
          if (-not $cli) { throw "fet-cl.exe not found in build/win" }

          New-Item -ItemType Directory -Force -Path build\package\translations | Out-Null
          Copy-Item $gui.FullName build\package\Open-Timetable.exe -Force
          Copy-Item $cli.FullName build\package\fet-cl.exe -Force

          windeployqt --release --no-translations --no-opengl-sw --compiler-runtime build\package\Open-Timetable.exe
          windeployqt --release --no-translations --no-opengl-sw --compiler-runtime build\package\fet-cl.exe

          if (Test-Path build\translations) {
            Copy-Item build\translations\*.qm build\package\translations\ -Force
          }

          # إضافة إضافة المنصّة offscreen (للفحص الذاتي من الحزمة نفسها)
          $offscreen = Join-Path $env:QT_ROOT_DIR 'plugins\platforms\qoffscreen.dll'
          if (Test-Path $offscreen) {
            Copy-Item $offscreen build\package\platforms\ -Force
            Write-Host "copied qoffscreen.dll"
          }

          # تحقق سريع من محتوى الحزمة
          if (-not (Test-Path build\package\platforms\qwindows.dll)) {
            throw "package is missing platforms/qwindows.dll"
          }
          $files = Get-ChildItem build\package -Recurse -File
          Write-Host ("package files: {0}, total {1:N1} MB" -f $files.Count, (($files | Measure-Object Length -Sum).Sum / 1MB))
          Copy-Item fet\LICENSE build\package\LICENSE -Force
          Copy-Item docs\INSTALL.md build\package\INSTALL.md -Force

          Compress-Archive -Path build\package\* -DestinationPath build\open-timetable-windows-x86_64.zip -Force
          Get-Item build\open-timetable-windows-x86_64.zip | Format-List Name, Length

      - name: Self-check on Windows (headless)
        shell: pwsh
        run: |
          # نستعمل ملف البناء (بيئة Qt كاملة) لأن إضافة offscreen مضمونة هناك،
          # مع مؤقّت إيقاف حتى لا يتعلّق السير إذا ظهر مربّع خطأ.
          $exe = Get-ChildItem -Path build\win -Recurse -Filter fet.exe | Select-Object -First 1
          if (-not $exe) { throw "fet.exe not found" }

          $env:QT_QPA_PLATFORM = "offscreen"
          $out = Join-Path $PWD "selfcheck-windows.log"
          $err = Join-Path $PWD "selfcheck-windows.err.log"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--ot-selfcheck" `
                 -NoNewWindow -PassThru -RedirectStandardOutput $out -RedirectStandardError $err

          if (-not $p.WaitForExit(90000)) {
            $p.Kill()
            throw "self-check did not finish within 90s (a modal dialog is probably blocking)"
          }

          Get-Content $out | ForEach-Object { Write-Host $_ }
          if (Test-Path $err) { Get-Content $err | Select-Object -First 20 | ForEach-Object { Write-Host $_ } }

          if ($p.ExitCode -ne 0) { throw "Windows self-check failed (exit $($p.ExitCode))" }
          if (-not (Select-String -Path $out -Pattern "SELFCHECK OK" -Quiet)) {
            throw "SELFCHECK OK not found in the report"
          }

      - name: Publish Windows self-check annotations
        if: always()
        shell: pwsh
        run: |
          if (Test-Path selfcheck-windows.log) {
            Get-Content selfcheck-windows.log |
              Select-String -Pattern '\[ok\]|\[FAIL\]|SELFCHECK|Qt:|platform:' |
              ForEach-Object { Write-Host "::notice::$($_.Line)" }
          }

      - name: Upload Windows self-check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-selfcheck
          path: selfcheck-windows.log
          retention-days: 7

      - name: Upload Windows portable package
        uses: actions/upload-artifact@v4
        with:
          name: open-timetable-windows-x86_64
          path: build/open-timetable-windows-x86_64.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build/win
          retention-days: 7
